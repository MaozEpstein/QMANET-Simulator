<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="75%">
      <stop offset="0%" stop-color="#121a2e"/>
      <stop offset="100%" stop-color="#0a0f1e"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="2.4" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="1" y="1" width="62" height="62" rx="14" fill="url(#bg)"/>

  <g stroke="#3ed3ff" stroke-width="1.6" stroke-opacity="0.55" fill="none">
    <line x1="32" y1="14" x2="16" y2="32"/>
    <line x1="32" y1="14" x2="48" y2="32"/>
    <line x1="16" y1="32" x2="32" y2="50"/>
    <line x1="48" y1="32" x2="32" y2="50"/>
    <line x1="16" y1="32" x2="48" y2="32"/>
  </g>

  <g filter="url(#glow)">
    <circle cx="32" cy="14" r="5.4" fill="#b388ff"/>
    <circle cx="16" cy="32" r="5.4" fill="#3ed3ff"/>
    <circle cx="48" cy="32" r="5.4" fill="#3ed3ff"/>
    <circle cx="32" cy="50" r="6.4" fill="#3ddc97"/>
  </g>
</svg>
